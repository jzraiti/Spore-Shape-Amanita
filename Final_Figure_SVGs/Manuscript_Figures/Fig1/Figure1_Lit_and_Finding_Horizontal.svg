  <text class="st3" transform="translate(220.98 273.45)"><tspan class="st14" x="0" y="0">More prevalent in </tspan><tspan class="st9" x="48.02" y="0">cold, dry </tspan><tspan class="st9" x="-3.5" y="7.2">climates</tspan><tspan class="st14" x="20.51" y="7.2"> </tspan><tspan class="st14" x="22.18" y="7.2">(8). More likely to be </tspan><tspan class="st9" x="13.51" y="14.4">SAP </tspan><tspan class="st14" x="27.51" y="14.4">(2). Species </tspan><tspan class="st9"><tspan x="4.18" y="21.6">reproducing </tspan><tspan x="40.85" y="21.6">late in the </tspan></tspan><tspan class="st9" x="4" y="28.8">season</tspan><tspan class="st14" x="24.68" y="28.8" xml:space="preserve"> (7). Dominate in </tspan><tspan class="st9" x="-3.33" y="36">coastal regions</tspan><tspan class="st14" x="40.68" y="36" xml:space="preserve"> ( 7). </tspan><tspan class="st9" x="54.68" y="36">Smaller </tspan><tspan class="st9" x="2.51" y="43.2">reproductive bodies</tspan><tspan class="st14" x="59.85" y="43.2" xml:space="preserve"> (5).</tspan></text>
  <rect class="st12" x="305.31" y="223.3" width="45.32" height="19.34" rx="5" ry="5"/>
  <rect class="st12" x="165.39" y="223.32" width="45.48" height="18" rx="5" ry="5"/>
  <text class="st8" transform="translate(169.89 230.9)"><tspan class="st6"><tspan x="0" y="0">More likely to </tspan></tspan><tspan class="st6" x="2.83" y="7.2">be </tspan><tspan class="st4" x="11.17" y="7.2">SAP</tspan><tspan class="st11" x="23.51" y="7.2"> </tspan><tspan class="st6" x="25.18" y="7.2">(4)</tspan></text>
  <text class="st3" transform="translate(310.3 231.35)"><tspan class="st14"><tspan x="0" y="0">More likely to </tspan></tspan><tspan class="st14" x="4.5" y="7.2">be </tspan><tspan class="st9" x="12.84" y="7.2">EM </tspan><tspan class="st14" x="23.51" y="7.2">(4)</tspan></text>
  <rect class="st12" x="223.81" y="207.26" width="67.73" height="50.13" rx="5" ry="5"/>
  <text class="st3" transform="translate(233.75 216.23)"><tspan class="st14" x="0" y="0">EM + SAP </tspan><tspan class="st9" x="29.51" y="0">do not </tspan><tspan class="st9" x="-1.26" y="7.2">differ</tspan><tspan class="st14" x="13.74" y="7.2" xml:space="preserve"> in spore size </tspan><tspan class="st14"><tspan x="-3.77" y="14.4">and spore shape</tspan><tspan x="40.93" y="14.4" xml:space="preserve"> (1). </tspan></tspan><tspan class="st14"><tspan x=".74" y="21.6">Spore traits show </tspan></tspan><tspan class="st9"><tspan x="-4.75" y="28.8">strong phylogenetic </tspan></tspan><tspan class="st9" x="9.92" y="36">signal </tspan><tspan class="st14" x="28.92" y="36">(4).</tspan></text>
  <rect class="st12" x="150.65" y="288.39" width="41.83" height="41.83" rx="5" ry="5"/>
  <text class="st8" transform="translate(157.19 301.43)"><tspan class="st4" x="0" y="0">SAP</tspan><tspan class="st11" x="12.34" y="0"> </tspan><tspan class="st4" x="14" y="0">fungi</tspan><tspan class="st6" x="28.66" y="0"> </tspan><tspan class="st6"><tspan x="-3.68" y="7.2">are small and </tspan></tspan><tspan class="st6"><tspan x="-4.85" y="14.4">elongate (3, 4, </tspan></tspan><tspan class="st6"><tspan x="7.5" y="21.6">5, 6).</tspan></tspan></text>
  <text class="st3" transform="translate(336.87 144.93)"><tspan class="st9" x="0" y="0">EM </tspan><tspan class="st9" x="10.67" y="0">fungi </tspan><tspan class="st14" x="26.99" y="0">are </tspan><tspan class="st14"><tspan x="5.32" y="7.2">large and </tspan></tspan><tspan class="st14"><tspan x="-6.18" y="14.4">spherical (3, 4, 5). </tspan></tspan><tspan class="st9"><tspan x="-6.35" y="21.6">Large spores are </tspan></tspan><tspan class="st9" x="-.67" y="28.8">spherical</tspan><tspan class="st14" x="25.67" y="28.8" xml:space="preserve"> (6).</tspan></text>
  <rect class="st12" x="214.72" y="138.15" width="85.9" height="59.65" rx="5" ry="5"/>
  <text class="st3" transform="translate(218.6 148.96)"><tspan class="st14" x="0" y="0">More prevalent in </tspan><tspan class="st9" x="48.02" y="0">warm, wet </tspan><tspan class="st9" x="-1.5" y="7.2">climates </tspan><tspan class="st14" x="24.18" y="7.2">(8). More likely to be </tspan><tspan class="st9" x="-1.16" y="14.4">EM </tspan><tspan class="st14" x="9.51" y="14.4">(2). Species </tspan><tspan class="st9" x="43.19" y="14.4">reproducing </tspan><tspan class="st9" x="6.17" y="21.6">early in the season</tspan><tspan class="st14" x="60.19" y="21.6" xml:space="preserve"> (7).  </tspan><tspan class="st14" x="1.18" y="28.8">Typical of more </tspan><tspan class="st9" x="43.86" y="28.8">continental </tspan><tspan class="st9" x="12.18" y="36">regions</tspan><tspan class="st14" x="33.85" y="36" xml:space="preserve"> (7). </tspan><tspan class="st9" x="46.18" y="36">Larger </tspan><tspan class="st9" x="4.51" y="43.2">reproductive bodies </tspan><tspan class="st14" x="63.52" y="43.2">(5).</tspan><tspan class="st14" x="72.52" y="43.2"> </tspan></text>
