  <text class="st3" transform="translate(572.67 216.7)"><tspan class="st9" x="0" y="0">Constrained in size.</tspan><tspan class="st14" x="56.68" y="0"> </tspan><tspan class="st14" x="1" y="7.2">Correlated with </tspan><tspan class="st9" x="43.02" y="7.2">high </tspan><tspan class="st9"><tspan x="15.67" y="14.4">localized </tspan></tspan><tspan class="st9" x="9.5" y="21.6">precipitation.</tspan><tspan class="st14" x="47.17" y="21.6"> </tspan><tspan class="st14"><tspan x="12.5" y="28.8">Prevalent in </tspan></tspan><tspan class="st9"><tspan x=".32" y="36">temperate climates.</tspan></tspan></text>
  <text class="st3" transform="translate(707.79 213.61)"><tspan class="st9"><tspan x="0" y="0">Unconstrained in </tspan></tspan><tspan class="st9" x="3.16" y="7.2">size.</tspan><tspan class="st14" x="16.17" y="7.2" xml:space="preserve"> Correlated </tspan><tspan class="st14" x="-.17" y="14.4">with </tspan><tspan class="st9" x="12.17" y="14.4">low localized </tspan><tspan class="st9" x="5.67" y="21.6">precipitation.</tspan><tspan class="st14" x="43.34" y="21.6"> </tspan><tspan class="st14"><tspan x="8.66" y="28.8">Prevalent in </tspan></tspan><tspan class="st9"><tspan x="8.5" y="36">continental </tspan></tspan><tspan class="st9"><tspan x="11.66" y="43.2">climates.</tspan></tspan></text>
  <rect class="st12" x="635.25" y="212.56" width="62.04" height="39.52" rx="5" ry="5"/>
  <text class="st3" transform="translate(637.25 220.58)"><tspan class="st14"><tspan x="0" y="0">Spore size and shape </tspan></tspan><tspan class="st14" x=".18" y="7.2">are </tspan><tspan class="st9" x="10.52" y="7.2">not explained by </tspan><tspan class="st9"><tspan x="10.52" y="14.4">phylogenetic </tspan></tspan><tspan class="st9"><tspan x=".68" y="21.6">history or Brownian </tspan></tspan><tspan class="st9"><tspan x="18.19" y="28.8">motion.</tspan></tspan></text>
  <rect class="st12" x="549.58" y="276.12" width="54.28" height="62.88" rx="5" ry="5"/>
  <text class="st3" transform="translate(563.38 283.43)"><tspan class="st14"><tspan x="0" y="0">Extremely </tspan></tspan><tspan class="st14"><tspan x="-8.01" y="7.2">elongate spores </tspan></tspan><tspan class="st14" x="-8.84" y="14.4">are </tspan><tspan class="st9" x="1.5" y="14.4">constrained </tspan><tspan class="st9" x="-5.34" y="21.6">to small size</tspan><tspan class="st14" x="30.34" y="21.6">. </tspan><tspan class="st14"><tspan x="-6.51" y="28.8">Small elongate </tspan></tspan><tspan class="st14"><tspan x="-9.18" y="36">spores are found </tspan></tspan><tspan class="st14" x="-11.84" y="43.2">in </tspan><tspan class="st9" x="-5.5" y="43.2">coastal regions </tspan><tspan class="st9"><tspan x="-1.33" y="50.4">in the U.S.</tspan></tspan></text>
  <rect class="st12" x="632.44" y="147.11" width="67.19" height="10.68" rx="5" ry="5"/>
  <text class="st0" transform="translate(635.53 154.16)"><tspan x="0" y="0">Constrained in shape</tspan></text>
  <text class="st7" transform="translate(48.36 430.87)"><tspan class="st14" x="0" y="0">Figure 1. Compared hypotheses from current literature to the findings of our study. </tspan><tspan class="st10" x="440.22" y="0">Amanita </tspan><tspan class="st14" x="487.58" y="0">spore shapes, in </tspan><tspan class="st10" x="578.96" y="0">Amanita</tspan><tspan class="st14" x="622.99" y="0" xml:space="preserve"> are simple, but what </tspan><tspan class="st14" x="0" y="14.4">shapes spore shape is complex.</tspan><tspan class="st10" x="171.43" y="14.4" xml:space="preserve"> (</tspan><tspan class="st14" x="178.76" y="14.4">A)</tspan><tspan class="st10" x="190.76" y="14.4"> </tspan><tspan class="st14" x="194.09" y="14.4">Current literature, identifies disparate ecological factors as dominant influences on spore shape and </tspan><tspan class="st14"><tspan x="0" y="28.8">size. Some hypotheses are contradictary. Ectomycorrhizal = EM; Saprotrophic = SAP. 1) Bassler et al. 2015; 2) Bassler et al. 2016; 3) </tspan></tspan><tspan class="st14"><tspan x="0" y="43.2">Calhim et al. 2018; 4) Halbwachs et al. 2015; 5) Halbwachs et al. 2018; 6) Kauserud et al. 2008; 7) Kauserud et al. 2011; 8) Pehim Limbu </tspan></tspan><tspan class="st14" x="0" y="57.6">et al. 2025. (B) We identify multiple drivers of variation in </tspan><tspan class="st10" x="303.46" y="57.6">Amanita </tspan><tspan class="st14" x="350.82" y="57.6">spore shape and size. </tspan></text>
  <text class="st5" transform="translate(87.38 59)"><tspan x="0" y="0">A</tspan></text>
  <text class="st5" transform="translate(498.53 59)"><tspan x="0" y="0">B</tspan></text>
