      <text class="st0" transform="translate(53.18 436.8) scale(.96 1)"><tspan x="0" y="0">Supplemental Figure 2. </tspan></text>
      <text class="st3" transform="translate(206.43 436.8) scale(.96 1)"><tspan x="0" y="0">Amanita </tspan></text>
      <text class="st0" transform="translate(263.4 436.8) scale(.96 1)"><tspan x="0" y="0">species tree inferred from publicly available genomes (23), with </tspan></text>
      <text class="st0" transform="translate(53.18 454.8) scale(.96 1)"><tspan x="0" y="0">internode certainty among gene trees (ICA) values shown at nodes. The resulting topology differs from that </tspan></text>
      <text class="st0" transform="translate(53.18 472.81) scale(.96 1)"><tspan x="0" y="0">recovered in Supplemental Figure 1: </tspan></text>
      <text class="st3" transform="translate(289.87 472.81) scale(.96 1)"><tspan x="0" y="0">A. inopinata</tspan></text>
      <text class="st0" transform="translate(366.12 472.81) scale(.96 1)"><tspan x="0" y="0" xml:space="preserve"> is not recovered as sister to </tspan></text>
      <text class="st3" transform="translate(550.62 472.81) scale(.96 1)"><tspan x="0" y="0">A. theirsii</tspan></text>
      <text class="st0" transform="translate(609.98 472.81) scale(.96 1)"><tspan x="0" y="0">, a member of the </tspan></text>
      <text class="st0" transform="translate(53.18 490.82) scale(.96 1)"><tspan x="0" y="0">saprotrophic clade of </tspan></text>
      <text class="st3" transform="translate(191.19 490.82) scale(.96 1)"><tspan x="0" y="0">Amanita</tspan></text>
      <text class="st0" transform="translate(244.14 490.82) scale(.96 1)"><tspan x="0" y="0">. ICA values indicate substantial conflict among gene trees at several nodes.</tspan></text>
