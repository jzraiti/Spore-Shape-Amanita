  <g class="st2">
    <text class="st4" transform="translate(610.62 782.89)"><tspan class="st1" x="0" y="0">Supplemental Figure 2. </tspan><tspan class="st6" x="227.3" y="0">Amanita </tspan><tspan class="st1" x="311.79" y="0">species tree inferred from publicly available genomes (23 species), with </tspan><tspan class="st1"><tspan x="0" y="25.69">internode certainty among gene trees (ICA) values shown at nodes. The resulting topology differs from that </tspan></tspan><tspan class="st1" x="0" y="51.38">recovered in Supplemental Figure 1: </tspan><tspan class="st6" x="351.06" y="51.38">A. inopinata</tspan><tspan class="st1" x="464.14" y="51.38" xml:space="preserve"> is not recovered as sister to </tspan><tspan class="st6" x="737.8" y="51.38">A. theirsii</tspan><tspan class="st1" x="825.84" y="51.38">, a member of the </tspan><tspan class="st1" x="0" y="77.07">saprotrophic clade of </tspan><tspan class="st6" x="204.69" y="77.07">Amanita</tspan><tspan class="st1" x="283.23" y="77.07">. ICA values indicate substantial conflict among gene trees at several nodes.</tspan></text>
