  <g class="st2">
    <g class="st2">
      <text class="st3" transform="translate(292.59 804.59)"><tspan x="0" y="0">Supplemental Figure 2. </tspan></text>
      <text class="st0" transform="translate(622.91 804.59)"><tspan x="0" y="0">Amanita </tspan></text>
      <text class="st3" transform="translate(745.69 804.59)"><tspan x="0" y="0">species tree inferred from publicly available genomes (23), with </tspan></text>
      <text class="st3" transform="translate(292.59 841.93)"><tspan x="0" y="0">internode certainty among gene trees (ICA) values shown at nodes. The resulting topology differs from that </tspan></text>
      <text class="st3" transform="translate(292.59 879.26)"><tspan x="0" y="0">recovered in Supplemental Figure 1: </tspan></text>
      <text class="st0" transform="translate(802.76 879.26)"><tspan x="0" y="0">A. inopinata</tspan></text>
      <text class="st3" transform="translate(967.09 879.26)"><tspan x="0" y="0" xml:space="preserve"> is not recovered as sister to </tspan></text>
      <text class="st0" transform="translate(1364.78 879.26)"><tspan x="0" y="0">A. theirsii</tspan></text>
      <text class="st3" transform="translate(1492.73 879.26)"><tspan x="0" y="0">, a member of the </tspan></text>
      <text class="st3" transform="translate(292.59 916.59)"><tspan x="0" y="0">saprotrophic clade of </tspan></text>
      <text class="st0" transform="translate(590.05 916.59)"><tspan x="0" y="0">Amanita</tspan></text>
      <text class="st3" transform="translate(704.19 916.59)"><tspan x="0" y="0">. ICA values indicate substantial conflict among gene trees at several nodes.</tspan></text>
    </g>
  </g>
