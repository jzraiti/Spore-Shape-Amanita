  <text class="st3" transform="translate(305.16 108.04)"><tspan class="st14"><tspan x="0" y="0">Constrained in </tspan></tspan><tspan class="st14" x="-.25" y="5.25">size.</tspan><tspan class="st13" x="9.23" y="5.25" xml:space="preserve"> Correlated </tspan><tspan class="st13" x="6.2" y="10.5">with </tspan><tspan class="st14" x="15.19" y="10.5">high </tspan><tspan class="st14"><tspan x="6.07" y="15.74">localized </tspan></tspan><tspan class="st14" x="1.58" y="20.99">precipitation.</tspan><tspan class="st13" x="29.03" y="20.99"> </tspan><tspan class="st13"><tspan x="3.76" y="26.24">Prevalent in </tspan></tspan><tspan class="st14"><tspan x="4.86" y="31.48">temperate </tspan></tspan><tspan class="st14"><tspan x="5.95" y="36.73">climates.</tspan></tspan></text>
  <text class="st3" transform="translate(395.79 109.43)"><tspan class="st14"><tspan x="0" y="0">Unconstrained </tspan></tspan><tspan class="st14" x="8.02" y="5.25">in size.</tspan><tspan class="st13" x="22.6" y="5.25"> </tspan><tspan class="st13"><tspan x=".6" y="10.5">Correlated with </tspan></tspan><tspan class="st14"><tspan x="1.82" y="15.74">low localized </tspan></tspan><tspan class="st14" x="1.58" y="20.99">precipitation.</tspan><tspan class="st13" x="29.03" y="20.99"> </tspan><tspan class="st13"><tspan x="3.76" y="26.24">Prevalent in </tspan></tspan><tspan class="st14"><tspan x="3.65" y="31.48">continental </tspan></tspan><tspan class="st14"><tspan x="5.95" y="36.73">climates.</tspan></tspan></text>
  <rect class="st11" x="344.62" y="97.01" width="42.52" height="56.69" rx="5" ry="5"/>
  <text class="st3" transform="translate(351.3 105.05)"><tspan class="st13"><tspan x="0" y="0">Spore size and </tspan></tspan><tspan class="st13" x=".85" y="5.25">shape are </tspan><tspan class="st14" x="21.52" y="5.25">not </tspan><tspan class="st14"><tspan x="1.34" y="10.5">explained by </tspan></tspan><tspan class="st14"><tspan x="1.1" y="15.74">phylogenetic </tspan></tspan><tspan class="st14"><tspan x="4.5" y="20.99">history or </tspan></tspan><tspan class="st14"><tspan x="-3.88" y="26.24">Brownian motion. </tspan></tspan><tspan class="st14"><tspan x="-3.04" y="31.48">Shape correlates </tspan></tspan><tspan class="st14"><tspan x="1.1" y="36.73">with terminal </tspan></tspan><tspan class="st14"><tspan x="5.84" y="41.98">velocity. </tspan></tspan></text>
  <rect class="st11" x="300.54" y="158.96" width="39.56" height="45.83" rx="5" ry="5"/>
  <text class="st3" transform="translate(310.6 164.27)"><tspan class="st13"><tspan x="0" y="0">Extremely </tspan></tspan><tspan class="st13"><tspan x="-5.84" y="5.25">elongate spores </tspan></tspan><tspan class="st13" x="-6.44" y="10.49">are </tspan><tspan class="st14" x="1.09" y="10.49">constrained </tspan><tspan class="st14" x="-3.89" y="15.74">to small size</tspan><tspan class="st13" x="22.11" y="15.74">. </tspan><tspan class="st13"><tspan x="-4.74" y="20.99">Small elongate </tspan></tspan><tspan class="st13"><tspan x="-6.69" y="26.24">spores are found </tspan></tspan><tspan class="st13" x="-8.63" y="31.48">in </tspan><tspan class="st14" x="-4.01" y="31.48">coastal regions </tspan><tspan class="st14"><tspan x="-.97" y="36.73">in the U.S.</tspan></tspan></text>
  <rect class="st11" x="344.45" y="62.97" width="42.52" height="28.35" rx="3.08" ry="3.08"/>
  <text class="st7" transform="translate(350.58 76.07)"><tspan x="0" y="0">Constrained in </tspan><tspan x="8.99" y="5.25">shape</tspan></text>
  <text class="st9" transform="translate(26.33 293.83)"><tspan class="st13" x="0" y="0">Figure 1. Comparing hypotheses interpreted from current literature to our findings. </tspan><tspan class="st15" x="365.18" y="0">(</tspan><tspan class="st13" x="368.51" y="0">A)</tspan><tspan class="st15" x="378.51" y="0"> </tspan><tspan class="st13" x="381.29" y="0">Current </tspan><tspan class="st13"><tspan x="0" y="12">literature identifies disparate variables as dominant influences on spore shape and size. Some </tspan></tspan><tspan class="st13"><tspan x="0" y="24">hypotheses are contradictary. Ectomycorrhizal = EM; Saprotrophic = SAP. Figure based on the </tspan></tspan><tspan class="st13"><tspan x="0" y="36">following literature: 1) Bassler et al. 2015; 2) Calhim et al. 2018; 3) Halbwachs et al. 2015; 4) </tspan></tspan><tspan class="st13"><tspan x="0" y="48">Kauserud et al. 2008 (note: this study is regarding polypores); 5) Kauserud et al. 2011; 6) Pehim </tspan></tspan><tspan class="st13"><tspan x="0" y="60">Limbu et al. 2025 (note this study is regarding arbuscular mycorrhizae); 7) Tulloss 2005 (B) We </tspan></tspan><tspan class="st13" x="0" y="72">identify multiple drivers of variation in </tspan><tspan class="st15" x="166.74" y="72">Amanita </tspan><tspan class="st13" x="206.2" y="72">spore shape and size. </tspan></text>
  <text class="st4" transform="translate(15.64 19.65)"><tspan x="0" y="0">A</tspan></text>
  <text class="st4" transform="translate(242.42 17.36)"><tspan x="0" y="0">B</tspan></text>
