  <text class="st8" transform="translate(102.06 164.37) scale(.94 1)"><tspan class="st13" x="0" y="0">Species </tspan><tspan class="st14" x="17.24" y="0">reproducing </tspan><tspan class="st14" x="44.71" y="0">later </tspan><tspan class="st14" x="8.74" y="5.39">in the season</tspan><tspan class="st13" x="37.47" y="5.39" xml:space="preserve"> (5). </tspan><tspan class="st13" x="6.74" y="10.79">Dominate in </tspan><tspan class="st14" x="31.98" y="10.79">coastal </tspan><tspan class="st14" x="14.99" y="16.18">regions</tspan><tspan class="st13" x="31.23" y="16.18" xml:space="preserve"> (5).</tspan></text>
