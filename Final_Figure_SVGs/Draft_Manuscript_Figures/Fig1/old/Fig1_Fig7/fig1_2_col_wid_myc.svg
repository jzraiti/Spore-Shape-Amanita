  <text class="st18" transform="translate(63.64 115.7)"><tspan class="st5"><tspan x="0" y="0">More likely to be </tspan></tspan><tspan class="st2" x="1.95" y="5.25">SAP</tspan><tspan class="st16" x="10.94" y="5.25"> </tspan><tspan class="st5" x="12.15" y="5.25">(2). More </tspan><tspan class="st5"><tspan x="5.59" y="10.5">likely to be </tspan></tspan><tspan class="st10"><tspan x=".97" y="15.74">temperate and </tspan></tspan><tspan class="st0"><tspan class="st17" x="4.13" y="20.99">tropical </tspan><tspan class="st13" x="21.14" y="20.99">(7).</tspan></tspan></text>
  <text class="st3" transform="translate(157.78 123.24)"><tspan class="st13"><tspan x="0" y="0">More likely to be </tspan></tspan><tspan class="st14"><tspan x=".37" y="5.25">alpine or arctic </tspan></tspan><tspan class="st13"><tspan x="12.64" y="10.5">(7).</tspan></tspan></text>
  <rect class="st11" x="103.57" y="104.46" width="45.35" height="41.96" rx="5" ry="5"/>
  <text class="st1" transform="translate(109.81 115.84)"><tspan class="st13" x="0" y="0">EM + SAP </tspan><tspan class="st14" x="19.94" y="0">do not </tspan><tspan class="st14" x="-3.21" y="4.86">differ</tspan><tspan class="st13" x="6.92" y="4.86" xml:space="preserve"> in spore size or </tspan><tspan class="st13"><tspan x="-3.44" y="9.73">shape</tspan><tspan x="7.6" y="9.73" xml:space="preserve"> (1). Volume (6) </tspan></tspan><tspan class="st13"><tspan x="1.4" y="14.59">and shape show </tspan></tspan><tspan class="st14" x="-2.76" y="19.46">phylogenetic signal</tspan><tspan class="st13" x="35.08" y="19.46"> </tspan><tspan class="st13"><tspan x="13.12" y="24.32">(1).</tspan></tspan></text>
  <rect class="st11" x="51.46" y="152.22" width="42.52" height="36.85" rx="5" ry="5"/>
  <text class="st18" transform="translate(59.42 158.84)"><tspan class="st2" x="0" y="0">SAP</tspan><tspan class="st16" x="8.99" y="0"> </tspan><tspan class="st2" x="10.21" y="0">fungi</tspan><tspan class="st5" x="20.89" y="0" xml:space="preserve"> are </tspan><tspan class="st5"><tspan x="4.86" y="5.25">small and </tspan></tspan><tspan class="st5"><tspan x="1.94" y="10.5">elongate (3). </tspan></tspan><tspan class="st10"><tspan x=".6" y="15.74">Small spores </tspan></tspan><tspan class="st10"><tspan x="3.77" y="20.99">tend to be </tspan></tspan><tspan class="st0"><tspan class="st17" x="1.94" y="26.24">elongate</tspan><tspan class="st13" x="19.92" y="26.24" xml:space="preserve"> (7)</tspan></tspan></text>
