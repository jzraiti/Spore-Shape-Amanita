  <text class="st7" transform="translate(18.15 264.61)"><tspan class="st11"><tspan x="0" y="0">Figure 1. Hypotheses interpreted from current </tspan></tspan><tspan class="st11" x="0" y="12">literature. </tspan><tspan class="st13" x="44.46" y="12">(</tspan><tspan class="st11" x="47.79" y="12">A)</tspan><tspan class="st13" x="57.79" y="12"> </tspan><tspan class="st11" x="60.57" y="12">The literature identifies </tspan><tspan class="st11"><tspan x="0" y="24">disparate variables as dominant influences on </tspan></tspan><tspan class="st11"><tspan x="0" y="36">spore shape and size. Some hypotheses are </tspan></tspan><tspan class="st11"><tspan x="0" y="48">contradictary. Ectomycorrhizal = EM; </tspan></tspan><tspan class="st11"><tspan x="0" y="60">Saprotrophic = SAP. Figure based on the </tspan></tspan><tspan class="st11"><tspan x="0" y="72">following: 1) Bassler et al. 2015; 2) Calhim et </tspan></tspan><tspan class="st11"><tspan x="0" y="84">al. 2018; 3) Halbwachs et al. 2015; 4) </tspan></tspan><tspan class="st11"><tspan x="0" y="96">Kauserud et al. 2008 (note: this study focuses </tspan></tspan><tspan class="st11"><tspan x="0" y="108">on polypores); 5) Kauserud et al. 2011; 6) </tspan></tspan><tspan class="st11"><tspan x="0" y="120">Pehim Limbu et al. 2025 (note: this study </tspan></tspan><tspan class="st11"><tspan x="0" y="132">focuses on arbuscular mycorrhizae); 7) </tspan></tspan><tspan class="st11"><tspan x="0" y="144">Tulloss 2005.</tspan></tspan></text>
