  <text class="st6" transform="translate(102.06 144.6) scale(.94 1)"><tspan class="st11" x="0" y="0">Species </tspan><tspan class="st12" x="17.24" y="0">reproducing </tspan><tspan class="st12" x="44.71" y="0">later </tspan><tspan class="st12" x="8.74" y="5.39">in the season</tspan><tspan class="st11" x="37.47" y="5.39" xml:space="preserve"> (5). </tspan><tspan class="st11" x="6.74" y="10.79">Dominate in </tspan><tspan class="st12" x="31.98" y="10.79">coastal </tspan><tspan class="st12" x="14.99" y="16.18">regions</tspan><tspan class="st11" x="31.23" y="16.18" xml:space="preserve"> (5).</tspan></text>
  <rect class="st9" x="155.16" y="84.99" width="36.85" height="42.17" rx="5" ry="5"/>
  <rect class="st9" x="61.13" y="84.64" width="36.85" height="42.17" rx="5" ry="5"/>
  <text class="st16" transform="translate(63.64 95.93)"><tspan class="st4"><tspan x="0" y="0">More likely to be </tspan></tspan><tspan class="st2" x="1.95" y="5.25">SAP</tspan><tspan class="st14" x="10.94" y="5.25"> </tspan><tspan class="st4" x="12.15" y="5.25">(2). More </tspan><tspan class="st4"><tspan x="5.59" y="10.5">likely to be </tspan></tspan><tspan class="st8"><tspan x=".97" y="15.74">temperate and </tspan></tspan><tspan class="st0"><tspan class="st15" x="4.13" y="20.99">tropical </tspan><tspan class="st11" x="21.14" y="20.99">(7).</tspan></tspan></text>
  <text class="st3" transform="translate(157.78 103.46)"><tspan class="st11"><tspan x="0" y="0">More likely to be </tspan></tspan><tspan class="st12"><tspan x=".37" y="5.25">alpine or arctic </tspan></tspan><tspan class="st11"><tspan x="12.64" y="10.5">(7).</tspan></tspan></text>
  <rect class="st9" x="103.57" y="84.69" width="45.35" height="41.96" rx="5" ry="5"/>
  <text class="st1" transform="translate(109.81 96.07)"><tspan class="st11" x="0" y="0">EM + SAP </tspan><tspan class="st12" x="19.94" y="0">do not </tspan><tspan class="st12" x="-3.21" y="4.86">differ</tspan><tspan class="st11" x="6.92" y="4.86" xml:space="preserve"> in spore size or </tspan><tspan class="st11"><tspan x="-3.44" y="9.73">shape</tspan><tspan x="7.6" y="9.73" xml:space="preserve"> (1). Volume (6) </tspan></tspan><tspan class="st11"><tspan x="1.4" y="14.59">and shape show </tspan></tspan><tspan class="st12" x="-2.76" y="19.46">phylogenetic signal</tspan><tspan class="st11" x="35.08" y="19.46"> </tspan><tspan class="st11"><tspan x="13.12" y="24.32">(1).</tspan></tspan></text>
  <rect class="st9" x="51.46" y="132.44" width="42.52" height="36.85" rx="5" ry="5"/>
  <text class="st16" transform="translate(59.42 139.07)"><tspan class="st2" x="0" y="0">SAP</tspan><tspan class="st14" x="8.99" y="0"> </tspan><tspan class="st2" x="10.21" y="0">fungi</tspan><tspan class="st4" x="20.89" y="0" xml:space="preserve"> are </tspan><tspan class="st4"><tspan x="4.86" y="5.25">small and </tspan></tspan><tspan class="st4"><tspan x="1.94" y="10.5">elongate (3). </tspan></tspan><tspan class="st8"><tspan x=".6" y="15.74">Small spores </tspan></tspan><tspan class="st8"><tspan x="3.77" y="20.99">tend to be </tspan></tspan><tspan class="st0"><tspan class="st15" x="1.94" y="26.24">elongate</tspan><tspan class="st11" x="19.92" y="26.24" xml:space="preserve"> (7)</tspan></tspan></text>
  <text class="st3" transform="translate(168.37 49.84)"><tspan class="st12" x="0" y="0">EM </tspan><tspan class="st12" x="7.77" y="0">fungi </tspan><tspan class="st11" x="19.67" y="0">are </tspan><tspan class="st11"><tspan x=".6" y="5.25">large (2) and </tspan></tspan><tspan class="st11"><tspan x=".36" y="10.49">spherical (3). </tspan></tspan><tspan class="st12"><tspan x="-4.62" y="15.74">Large spores are </tspan></tspan><tspan class="st12" x="-.49" y="20.99">spherical</tspan><tspan class="st11" x="18.71" y="20.99" xml:space="preserve"> (4).</tspan></text>
  <rect class="st9" x="97.9" y="39.92" width="56.69" height="39.69" rx="5" ry="5"/>
  <text class="st3" transform="translate(104.83 48.86)"><tspan class="st11" x="0" y="0">Species </tspan><tspan class="st12" x="16.77" y="0">reproducing </tspan><tspan class="st12" x="-3.89" y="5.25">earlier in the season</tspan><tspan class="st11" x="38.4" y="5.25" xml:space="preserve"> (5).  </tspan><tspan class="st11"><tspan x="6.2" y="10.5">Typical of more </tspan></tspan><tspan class="st12" x="-2.91" y="15.74">continental regions</tspan><tspan class="st11" x="37.42" y="15.74" xml:space="preserve"> (5). </tspan><tspan class="st11" x="-2.68" y="20.99">More prevalent in </tspan><tspan class="st12" x="32.32" y="20.99">warm, </tspan><tspan class="st12" x="4.25" y="26.24">wet climates </tspan><tspan class="st11" x="31.47" y="26.24">(6).</tspan></text>
  <text class="st5" transform="translate(34.24 234.07)"><tspan x="0" y="0">Hypothesized Influences on Spore Shape</tspan></text>
