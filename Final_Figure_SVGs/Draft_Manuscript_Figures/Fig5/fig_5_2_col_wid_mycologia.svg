  <text class="st4" transform="translate(306.78 218.92)"><tspan x="0" y="0">Köppen Climate Group</tspan></text>
  <text class="st8" transform="translate(235.92 17.71)"><tspan x="0" y="0">B</tspan></text>
  <text class="st8" transform="translate(.3 17.71)"><tspan x="0" y="0">A</tspan></text>
  <text class="st7" transform="translate(20.04 241.05)"><tspan x="0" y="0">Figure 5. The influence of climate on spore shape. (A) Mean of PC1 by species as a </tspan><tspan x="0" y="12">function of precipitation during the 30 days prior to collection of each species. Pearson </tspan><tspan x="0" y="24" xml:space="preserve">linear correlation r and r² reported in-panel (r = -0.37, r² = 0.14, p &lt; 0.01).  (B) Mean PC1 of </tspan><tspan x="0" y="36">species </tspan></text>
  <text class="st0" transform="translate(57.01 277.05)"><tspan x="0" y="0">Köppen Climate Groups (p &lt; 0.05). Because closely related species may resemble </tspan><tspan x="-36.96" y="12">one another based on shared evolutionary history, we also fit phylogenetic generalized least </tspan><tspan x="-36.96" y="24">squares (PGLS) models on the subset of species for which phylogenetic data were </tspan><tspan x="-36.96" y="36">available. We compared three models predicting PC1 from (1) precipitation, (2) climate </tspan><tspan x="-36.96" y="48">group, and (3) both predictors using Akaike’s Information Criterion corrected for small </tspan><tspan x="-36.96" y="60">sample size (AICc). The model including precipitation alone received the strongest support </tspan><tspan x="-36.96" y="72">(R² = 0.24, p = 0.0202), whereas climate group did not explain additional variation once </tspan><tspan x="-36.96" y="84">precipitation was included.</tspan></text>
