  <text class="st1" transform="translate(112.01 85.19)"><tspan class="st6"><tspan x="0" y="0">Spore size and </tspan></tspan><tspan class="st6" x=".85" y="5.25">shape are </tspan><tspan class="st7" x="21.52" y="5.25">not </tspan><tspan class="st7"><tspan x="1.34" y="10.5">explained by </tspan></tspan><tspan class="st7"><tspan x="1.1" y="15.74">phylogenetic </tspan></tspan><tspan class="st7"><tspan x="4.5" y="20.99">history or </tspan></tspan><tspan class="st7"><tspan x="-3.88" y="26.24">Brownian motion. </tspan></tspan><tspan class="st7"><tspan x="-3.04" y="31.48">Shape correlates </tspan></tspan><tspan class="st7"><tspan x="1.1" y="36.73">with terminal </tspan></tspan><tspan class="st7"><tspan x="5.84" y="41.98">velocity. </tspan></tspan></text>
