  <text class="st6" transform="translate(16.45 226.84)"><tspan class="st0" x="0" y="0">Supplemental Figure 2. </tspan><tspan class="st9" x="127.41" y="0">Amanita </tspan><tspan class="st0" x="174.76" y="0">species tree inferred from publicly available </tspan><tspan class="st0"><tspan x="0" y="14.4">genomes, with lossless internode certainty all values (lossless ICA) among </tspan></tspan><tspan class="st0"><tspan x="0" y="28.8">gene trees shown at nodes. Lossless ICA values range from −1 to 1, with </tspan></tspan><tspan class="st0"><tspan x="0" y="43.2">positive values indicating gene tree concordance with the species tree </tspan></tspan><tspan class="st0"><tspan x="0" y="57.6">shown, values near zero indicating conflict, and negative values indicating </tspan></tspan><tspan class="st0"><tspan x="0" y="72">that an alternative topology is more frequent at that node. The resulting </tspan></tspan><tspan class="st0" x="0" y="86.4">topology differs from the topology recovered in Supplemental Figure 1: </tspan><tspan class="st9" x="377.54" y="86.4">A. </tspan><tspan class="st9" x="0" y="100.8">inopinata</tspan><tspan class="st0" x="48.71" y="100.8" xml:space="preserve"> is not sister to </tspan><tspan class="st9" x="129.4" y="100.8">A. theirsii </tspan><tspan class="st0" x="182.09" y="100.8">(underlined node above), a species in the </tspan><tspan class="st0" x="0" y="115.2">saprotrophic clade of </tspan><tspan class="st9" x="114.73" y="115.2">Amanita</tspan><tspan class="st0" x="158.75" y="115.2">. ICA values indicate substantial conflict </tspan><tspan class="st0"><tspan x="0" y="129.6">among gene trees.</tspan></tspan></text>
