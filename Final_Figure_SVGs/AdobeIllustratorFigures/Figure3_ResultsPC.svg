  <text class="st6" transform="translate(125.83 473.56)"><tspan class="st11"><tspan x="0" y="0">Fig. 3 Fourier Transform and Principal Component Analysis Results. (a) Variation in Amanita spore shape </tspan></tspan><tspan class="st11"><tspan x="0" y="14.4">along the axis of the top 3 principal components. Principal component 1 (PC1) is analogous to the </tspan></tspan><tspan class="st11"><tspan x="0" y="28.8">“Elongate-Globose” spectrum qualitatively described by taxonomists. Principal Component 2 (PC2) </tspan></tspan><tspan class="st11"><tspan x="0" y="43.2">represents the placement of the hilar appendix. Principal Component 3 (PC3) represents the prominence of </tspan></tspan><tspan class="st11" x="0" y="57.6">the hilar appendix. (b) </tspan><tspan class="st0" x="113.46" y="57.6">Variance Explained by First 5 Principal Components</tspan><tspan class="st11" x="373.94" y="57.6">. Principal Component 1 (PC1) </tspan><tspan class="st11"><tspan x="0" y="72">explains the vast majority of the of variation. </tspan></tspan></text>
